name: Maintain scheduled workflows
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/keep-schedules-active.yml']
  schedule:
    - cron: '23 2 1 * *'
permissions:
  contents: write
concurrency:
  group: schedule-maintenance
  cancel-in-progress: false
jobs:
  maintenance:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Record active scheduler maintenance
        run: |
          mkdir -p .github
          date -u '+%Y-%m-%d' > .github/schedule-maintenance-date.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/schedule-maintenance-date.txt
          git diff --cached --quiet && exit 0
          git commit -m 'chore: record scheduled workflow maintenance'
          git push
