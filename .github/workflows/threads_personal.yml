name: Threads Personal

on:
  workflow_dispatch:
    inputs:
      publish:
        description: '正式發文（不勾選＝只檢查）'
        type: boolean
        required: true
        default: false
  # 確認手動發布成功後，取消下面兩行註解：每天台灣時間 21:00。
  schedule:
    - cron: '0 2 * * *'

permissions:
  contents: read

concurrency:
  group: threads-personal-publisher
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check or publish
        env:
          NOTION_TOKEN_2: ${{ secrets.NOTION_TOKEN_2 }}
          NOTION_PERSONAL_DATABASE_ID: ${{ secrets.NOTION_PERSONAL_DATABASE_ID }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          PUBLISH: ${{ github.event_name == 'schedule' || inputs.publish }}
        run: |
          if [ "$PUBLISH" = "true" ]; then
            python threads_personal.py --publish
          else
            python threads_personal.py
          fi
